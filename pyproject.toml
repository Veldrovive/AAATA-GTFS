[project]
name = "aaata-gtfs"
version = "0.1.0"
description = "Collector and tools for TheRide (AAATA) GTFS-realtime and static GTFS data"
readme = "README.md"
authors = [
    { name = "Aidan Dempster", email = "aidan.dempster@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "folium>=0.20.0",
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "sqlmodel>=0.0.48",
    "xyzservices>=2026.9.1",
]

[project.optional-dependencies]
# The bus position model (`aaata_gtfs.model`); not needed by the collector.
model = [
    "matplotlib>=3.11.2",
    "torch>=2.9",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
]

# PyPI's Linux aarch64 torch wheels pull in CUDA; on the Pi use the CPU-only build.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits TheRide's real feeds (needs network); run with `uv run pytest -m live`",
]
