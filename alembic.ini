# Alembic's command line, for writing migrations:
#   uv run alembic revision --autogenerate -m "describe the change"
#   uv run alembic upgrade head   (the collector also does this at startup)
# It opens the database under AAATA_GTFS_DATA_PATH (default ./data).

[alembic]
script_location = %(here)s/src/aaata_gtfs/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
